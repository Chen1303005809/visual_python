[project]
name = "dify-python-validator"
version = "0.1.0"
description = "OpenAPI tools for static checking and sandboxed testing of Python code generated by Dify agents."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
